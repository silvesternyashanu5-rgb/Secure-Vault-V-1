      property="og:description"
      content="Encrypted offline-first PWA vault with IndexedDB storage, PIN/password & biometric lock, calculator disguise, privacy-first ad controls, dark mode, and cloud sync."

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="SecureVault" />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('securevault_theme') || 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          var rawBrand = localStorage.getItem('securevault_branding');
          if (rawBrand) {
            var brand = JSON.parse(rawBrand);
            if (brand && brand.name) {
              document.title = brand.name;
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
